<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', Meiryo, sans-serif; background: #f5f8fc; color: #132a45; }
    a { color: #14559c; } a:hover { color: #0d3d75; }
    .hd { height: 56px; border-bottom: 2px solid #132a45; display: flex; align-items: center; padding: 0 24px; gap: 16px; background: #fff; }
    .btn-p { border: 2px solid #132a45; border-radius: 4px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0 32px; font-size: 16px; background: #132a45; color: #f5f8fc; }
    .btn-s { border: 1.5px solid #7a8da5; border-radius: 4px; height: 30px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #42566e; background: #fff; }
    .choice { border: 2px solid #132a45; border-radius: 6px; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 18px; font-size: 16px; background: #fff; }
    .num { width: 22px; height: 22px; border: 1.5px solid #7a8da5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #42566e; flex-shrink: 0; }
    .blank { background: #bfdbfe; border: 2px solid #3f76b8; border-radius: 4px; display: inline-block; vertical-align: middle; height: 34px; line-height: 30px; min-width: 128px; padding: 0 10px; }
    .mask { background: #ccd6e3; border: 2px solid #7a8da5; border-radius: 4px; display: inline-block; vertical-align: middle; height: 34px; line-height: 30px; padding: 0 10px; color: #42566e; font-size: 15px; }
    .muted { color: #566779; font-size: 12px; }
  </style>
</helmet>

<div style="width: 1180px; height: 800px; display: flex; flex-direction: column; background: #f5f8fc;">

  <div class="hd">
    <div style="font-size: 13px; color: #42566e; display: flex; align-items: center; gap: 8px;">
      <span>基本情報技術者</span><span>／</span><span>テクノロジ系</span><span>／</span><span style="color: #132a45;">基礎理論 ・ 2進数</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 180px; height: 8px; border: 1.5px solid #132a45; border-radius: 5px; overflow: hidden; background: #fff;">
        <div style="width: 32%; height: 100%; background: #132a45;"></div>
      </div>
      <div style="font-size: 13px; color: #42566e;">12 / 122</div>
    </div>
    <div class="btn-s">中断</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 26px 40px; min-height: 0;">

    <div style="border: 2px solid #132a45; border-radius: 6px; background: #fff; display: flex; flex-direction: column;">
      <div style="height: 38px; border-bottom: 1.5px solid #c2cfdf; display: flex; align-items: center; padding: 0 16px; gap: 10px; background: #e8eef7;">
        <div style="font-size: 12px; color: #42566e; flex-grow: 1;">表示範囲：章「2進数」</div>
        <div class="btn-s" style="height: 26px; font-size: 12px;">表示範囲を広げる ▾</div>
      </div>
      <div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; font-size: 17px; line-height: 2.4;">
        <div style="font-size: 20px; line-height: 1.4;">2進数</div>
        <div>
          コンピュータは 2進数 で数を扱う。1桁を <span class="blank">&nbsp;</span> と呼び、8桁をまとめたものを <span class="mask">〈単位〉</span> という。
        </div>
        <div>
          2進数の各桁は 0 か 1 のいずれかをとり、桁が1つ増えるごとに表せる値は2倍になる。
        </div>
      </div>
      <div style="padding: 10px 16px; border-top: 1.5px solid #c2cfdf; display: flex; align-items: center; gap: 18px;">
        <div style="display: flex; align-items: center; gap: 7px;"><span style="width: 14px; height: 14px; background: #bfdbfe; border: 1.5px solid #3f76b8; border-radius: 3px;"></span><span class="muted">今回の問題</span></div>
        <div style="display: flex; align-items: center; gap: 7px;"><span style="width: 14px; height: 14px; background: #ccd6e3; border: 1.5px solid #7a8da5; border-radius: 3px;"></span><span class="muted">同じタグのため伏せた語</span></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="muted">選択肢から選ぶ</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <div class="choice"><span class="num">1</span><span>バイト</span></div>
        <div class="choice"><span class="num">2</span><span>ビット</span></div>
        <div class="choice"><span class="num">3</span><span>ワード</span></div>
        <div class="choice"><span class="num">4</span><span>ヘルツ</span></div>
      </div>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="muted">数字キーでも選べる</div>
      <div style="flex-grow: 1;"></div>
      <div class="btn-p">解答する</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
