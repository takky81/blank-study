<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', Meiryo, sans-serif; background: #faf9f5; color: #26251f; }
    a { color: #8a6d1f; } a:hover { color: #5f4a12; }
    .hd { height: 56px; border-bottom: 2px solid #26251f; display: flex; align-items: center; padding: 0 24px; gap: 16px; background: #fff; }
    .btn-s { border: 1.5px solid #a8a69c; border-radius: 4px; height: 30px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #6b6a62; background: #fff; }
    .sec { border: 2px solid #26251f; border-radius: 6px; background: #fff; display: flex; flex-direction: column; }
    .sec-hd { padding: 11px 18px; border-bottom: 1.5px solid #c9c7bd; font-size: 13px; color: #6b6a62; background: #f2f1ea; }
    .trow { display: flex; align-items: center; gap: 12px; padding: 9px 18px; font-size: 14px; }
    .bar { width: 132px; height: 12px; border: 1.5px solid #26251f; border-radius: 3px; overflow: hidden; display: flex; flex-shrink: 0; }
    .muted { color: #8a887d; font-size: 12px; }
    .num { font-size: 13px; color: #6b6a62; text-align: right; }
  </style>
</helmet>

<div style="width: 1180px; height: 800px; display: flex; flex-direction: column; background: #faf9f5;">

  <div class="hd">
    <div style="font-size: 17px;">穴埋め学習</div>
    <div style="font-size: 13px; color: #6b6a62;">／ 学習履歴</div>
    <div style="flex-grow: 1;"></div>
    <div class="btn-s">ダーク</div>
    <div class="btn-s">ログアウト</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 24px 40px; min-height: 0;">

    <div style="display: flex; gap: 16px;">
      <div style="border: 2px solid #26251f; border-radius: 6px; background: #fff; padding: 14px 20px; display: flex; flex-direction: column; gap: 4px;">
        <div class="muted">今日の復習</div>
        <div style="font-size: 24px;">23 問</div>
      </div>
      <div style="border: 2px solid #26251f; border-radius: 6px; background: #fff; padding: 14px 20px; display: flex; flex-direction: column; gap: 4px;">
        <div class="muted">今週の復習</div>
        <div style="font-size: 24px;">88 問</div>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="display: flex; align-items: center; gap: 6px;"><span style="width: 13px; height: 13px; background: #e8e6dd; border: 1.5px solid #a8a69c;"></span><span class="muted">未出題</span></div>
        <div style="display: flex; align-items: center; gap: 6px;"><span style="width: 13px; height: 13px; background: #f0b39a; border: 1.5px solid #c2410c;"></span><span class="muted">苦手</span></div>
        <div style="display: flex; align-items: center; gap: 6px;"><span style="width: 13px; height: 13px; background: #26251f;"></span><span class="muted">定着</span></div>
      </div>
    </div>

    <div class="sec" style="flex-grow: 1; min-height: 0;">
      <div class="sec-hd">科目 ・ 教材 ・ 章</div>
      <div style="flex-grow: 1; padding: 8px 0; overflow: hidden;">

        <div class="trow">
          <span style="color: #8a887d; width: 12px;">▾</span>
          <span style="flex-grow: 1;">基本情報技術者</span>
          <span class="bar"><span style="width: 46%; background: #26251f;"></span><span style="width: 22%; background: #f0b39a;"></span><span style="width: 32%; background: #e8e6dd;"></span></span>
          <span class="num" style="width: 62px;">412 問</span>
          <span class="num" style="width: 46px;">78%</span>
          <span class="num" style="width: 62px;">今日 23</span>
        </div>

        <div class="trow" style="padding-left: 44px;">
          <span style="color: #8a887d; width: 12px;">▾</span>
          <span style="flex-grow: 1;">テクノロジ系</span>
          <span class="bar"><span style="width: 62%; background: #26251f;"></span><span style="width: 14%; background: #f0b39a;"></span><span style="width: 24%; background: #e8e6dd;"></span></span>
          <span class="num" style="width: 62px;">210 問</span>
          <span class="num" style="width: 46px;">85%</span>
          <span class="num" style="width: 62px;">今日 9</span>
        </div>

        <div class="trow" style="padding-left: 88px;">
          <span style="width: 12px;"></span>
          <span style="flex-grow: 1;">基礎理論</span>
          <span class="bar"><span style="width: 78%; background: #26251f;"></span><span style="width: 8%; background: #f0b39a;"></span><span style="width: 14%; background: #e8e6dd;"></span></span>
          <span class="num" style="width: 62px;">64 問</span>
          <span class="num" style="width: 46px;">91%</span>
          <span class="num" style="width: 62px;">今日 2</span>
        </div>

        <div class="trow" style="padding-left: 88px;">
          <span style="width: 12px;"></span>
          <span style="flex-grow: 1;">アルゴリズム</span>
          <span class="bar"><span style="width: 24%; background: #26251f;"></span><span style="width: 44%; background: #f0b39a;"></span><span style="width: 32%; background: #e8e6dd;"></span></span>
          <span class="num" style="width: 62px;">58 問</span>
          <span class="num" style="width: 46px;">52%</span>
          <span class="num" style="width: 62px;">今日 7</span>
        </div>

        <div class="trow" style="padding-left: 44px;">
          <span style="color: #8a887d; width: 12px;">▸</span>
          <span style="flex-grow: 1;">マネジメント系</span>
          <span class="bar"><span style="width: 38%; background: #26251f;"></span><span style="width: 26%; background: #f0b39a;"></span><span style="width: 36%; background: #e8e6dd;"></span></span>
          <span class="num" style="width: 62px;">88 問</span>
          <span class="num" style="width: 46px;">72%</span>
          <span class="num" style="width: 62px;">今日 6</span>
        </div>

        <div class="trow">
          <span style="color: #8a887d; width: 12px;">▸</span>
          <span style="flex-grow: 1;">生物基礎</span>
          <span class="bar"><span style="width: 30%; background: #26251f;"></span><span style="width: 18%; background: #f0b39a;"></span><span style="width: 52%; background: #e8e6dd;"></span></span>
          <span class="num" style="width: 62px;">186 問</span>
          <span class="num" style="width: 46px;">64%</span>
          <span class="num" style="width: 62px;">今日 11</span>
        </div>

      </div>
    </div>

    <div style="display: flex; gap: 18px; height: 216px;">

      <div class="sec" style="flex-grow: 1; flex-basis: 0; min-width: 0;">
        <div class="sec-hd">苦手キーワード</div>
        <div style="flex-grow: 1; padding: 6px 0; overflow: hidden;">
          <div class="trow" style="padding-top: 7px; padding-bottom: 7px;"><span style="flex-grow: 1;">スタック</span><span class="muted">アルゴリズム</span><span class="num" style="width: 42px;">31%</span></div>
          <div class="trow" style="padding-top: 7px; padding-bottom: 7px;"><span style="flex-grow: 1;">二分探索木</span><span class="muted">アルゴリズム</span><span class="num" style="width: 42px;">38%</span></div>
          <div class="trow" style="padding-top: 7px; padding-bottom: 7px;"><span style="flex-grow: 1;">スループット</span><span class="muted">構成要素</span><span class="num" style="width: 42px;">44%</span></div>
          <div class="trow" style="padding-top: 7px; padding-bottom: 7px;"><span style="flex-grow: 1;">正規化</span><span class="muted">データベース</span><span class="num" style="width: 42px;">50%</span></div>
        </div>
      </div>

      <div class="sec" style="flex-grow: 1; flex-basis: 0; min-width: 0;">
        <div class="sec-hd">日別の学習量</div>
        <div style="flex-grow: 1; padding: 18px 20px 12px; display: flex; align-items: flex-end; gap: 10px;">
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 44px; background: #26251f; border-radius: 2px;"></div><div class="muted">月</div></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 78px; background: #26251f; border-radius: 2px;"></div><div class="muted">火</div></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 26px; background: #26251f; border-radius: 2px;"></div><div class="muted">水</div></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 96px; background: #26251f; border-radius: 2px;"></div><div class="muted">木</div></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 60px; background: #26251f; border-radius: 2px;"></div><div class="muted">金</div></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 14px; background: #26251f; border-radius: 2px;"></div><div class="muted">土</div></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 70px; background: #26251f; border-radius: 2px;"></div><div class="muted">日</div></div>
        </div>
      </div>

    </div>

  </div>

</div>
</x-dc>
</body>
</html>
