<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', Meiryo, sans-serif; background: #faf9f5; color: #26251f; }
    a { color: #8a6d1f; } a:hover { color: #5f4a12; }
    .btn { border: 2px solid #26251f; border-radius: 4px; height: 38px; display: flex; align-items: center; padding: 0 18px; font-size: 14px; background: #fff; }
    .btn-p { border: 2px solid #26251f; border-radius: 4px; height: 38px; display: flex; align-items: center; padding: 0 22px; font-size: 14px; background: #26251f; color: #faf9f5; }
    .rd { width: 15px; height: 15px; border: 2px solid #26251f; border-radius: 50%; flex-shrink: 0; }
    .rd-on { width: 15px; height: 15px; border: 4.5px solid #26251f; border-radius: 50%; background: #fff; flex-shrink: 0; }
    .cb { width: 16px; height: 16px; border: 2px solid #26251f; border-radius: 3px; flex-shrink: 0; }
    .cb-on { width: 16px; height: 16px; border: 2px solid #26251f; border-radius: 3px; background: #26251f; flex-shrink: 0; }
    .sel { border: 2px solid #26251f; border-radius: 4px; height: 38px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; background: #fff; gap: 10px; }
    .lbl { font-size: 13px; color: #6b6a62; }
    .muted { color: #8a887d; font-size: 12px; }
    .trow { display: flex; align-items: center; gap: 9px; padding: 6px 0; font-size: 13.5px; }
  </style>
</helmet>

<div style="width: 820px; height: 620px; display: flex; align-items: center; justify-content: center; background: #d8d6cc; padding: 20px;">

  <div style="width: 100%; height: 100%; border: 2px solid #26251f; border-radius: 8px; background: #faf9f5; display: flex; flex-direction: column;">

    <div style="padding: 16px 22px; border-bottom: 2px solid #26251f; display: flex; align-items: center; gap: 12px;">
      <div style="font-size: 18px; flex-grow: 1;">インポート</div>
      <div class="muted">テクノロジ系.zip</div>
    </div>

    <div style="flex-grow: 1; padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div class="lbl">取り込む単位</div>
        <div style="display: flex; gap: 24px;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;"><span class="rd-on"></span><span>教材まるごと</span></div>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6b6a62;"><span class="rd"></span><span>一部の章だけ</span></div>
        </div>
      </div>

      <div style="display: flex; gap: 16px;">
        <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 9px; min-width: 0;">
          <div class="lbl">取り込み先の科目</div>
          <div class="sel"><span style="flex-grow: 1;">基本情報技術者</span><span style="color: #8a887d;">▾</span></div>
        </div>
        <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 9px; min-width: 0;">
          <div class="lbl">教材名</div>
          <div class="sel"><span style="flex-grow: 1;">テクノロジ系</span></div>
        </div>
      </div>

      <div style="flex-grow: 1; border: 2px solid #26251f; border-radius: 6px; background: #fff; display: flex; flex-direction: column; min-height: 0;">
        <div style="padding: 9px 14px; border-bottom: 1.5px solid #c9c7bd; background: #f2f1ea; display: flex; align-items: center; gap: 10px;">
          <div style="font-size: 12px; color: #6b6a62; flex-grow: 1;">zip の中身</div>
          <div class="muted">12 章 ・ 210 キーワード</div>
        </div>
        <div style="flex-grow: 1; padding: 10px 16px; overflow: hidden;">
          <div class="trow"><span class="cb-on"></span><span style="color: #8a887d;">▾</span><span style="flex-grow: 1;">010_基礎理論</span><span class="muted">64</span></div>
          <div class="trow" style="padding-left: 30px;"><span class="cb-on"></span><span style="flex-grow: 1;">010_2進数</span><span class="muted">22</span></div>
          <div class="trow" style="padding-left: 30px;"><span class="cb-on"></span><span style="flex-grow: 1;">020_論理演算</span><span class="muted">18</span></div>
          <div class="trow"><span class="cb-on"></span><span style="color: #8a887d;">▸</span><span style="flex-grow: 1;">020_アルゴリズム</span><span class="muted">58</span></div>
          <div class="trow"><span class="cb-on"></span><span style="color: #8a887d;">▸</span><span style="flex-grow: 1;">030_コンピュータ構成要素</span><span class="muted">88</span></div>
        </div>
      </div>

    </div>

    <div style="padding: 14px 22px; border-top: 2px solid #26251f; display: flex; align-items: center; gap: 12px;">
      <div class="muted">正答が一致しないキーワードは次の画面で確認します</div>
      <div style="flex-grow: 1;"></div>
      <div class="btn">キャンセル</div>
      <div class="btn-p">取り込む</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
