<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', Meiryo, sans-serif; background: #f5f8fc; color: #132a45; }
    a { color: #14559c; } a:hover { color: #0d3d75; }
    .fld { border: 2px solid #132a45; border-radius: 4px; height: 40px; display: flex; align-items: center; padding: 0 12px; font-size: 15px; background: #fff; }
    .btn { border: 2px solid #132a45; border-radius: 4px; height: 38px; display: flex; align-items: center; padding: 0 18px; font-size: 14px; background: #fff; }
    .btn-p { border: 2px solid #132a45; border-radius: 4px; height: 38px; display: flex; align-items: center; padding: 0 22px; font-size: 14px; background: #132a45; color: #f5f8fc; }
    .btn-x { width: 34px; height: 40px; border: 1.5px solid #7a8da5; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #42566e; font-size: 15px; background: #fff; flex-shrink: 0; }
    .chip { border: 1.5px solid #132a45; border-radius: 14px; height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 12px; font-size: 13px; background: #fff; }
    .lbl { font-size: 13px; color: #42566e; }
    .muted { color: #566779; font-size: 12px; }
  </style>
</helmet>

<div style="width: 820px; height: 620px; display: flex; align-items: center; justify-content: center; background: #d8d6cc; padding: 24px;">

  <div style="width: 100%; border: 2px solid #132a45; border-radius: 8px; background: #f5f8fc; display: flex; flex-direction: column;">

    <div style="padding: 18px 24px; border-bottom: 2px solid #132a45; display: flex; align-items: center; gap: 12px;">
      <div style="font-size: 18px; flex-grow: 1;">キーワードを編集</div>
      <div class="muted">id = k71m2p</div>
    </div>

    <div style="flex-grow: 1; padding: 22px 24px; display: flex; flex-direction: column; gap: 20px;">

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="lbl" style="flex-grow: 1;">正答</div>
          <div class="muted">どれを答えても正解になる</div>
        </div>
        <div style="display: flex; gap: 8px;"><div class="fld" style="flex-grow: 1;">ビット</div><div class="btn-x">×</div></div>
        <div style="display: flex; gap: 8px;"><div class="fld" style="flex-grow: 1;">bit</div><div class="btn-x">×</div></div>
        <div style="display: flex; align-items: center; gap: 8px;"><div class="btn" style="height: 32px; font-size: 13px;">＋ 正答を追加</div></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div class="lbl">タグ</div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
          <div class="chip"><span>単位</span><span style="color: #566779;">×</span></div>
          <div class="chip"><span>基礎理論</span><span style="color: #566779;">×</span></div>
          <div style="border: 1.5px dashed #7a8da5; border-radius: 14px; height: 28px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #7a8da5;">＋ タグ</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="lbl" style="flex-grow: 1;">誤答選択肢</div>
          <div class="muted">空のままなら同じタグのキーワードから自動で選ばれる</div>
        </div>
        <div style="display: flex; gap: 8px;">
          <div class="fld" style="flex-grow: 1;">バイト</div>
          <div class="fld" style="flex-grow: 1;">ワード</div>
          <div class="fld" style="flex-grow: 1; color: #7a8da5;">＋</div>
        </div>
      </div>

    </div>

    <div style="padding: 16px 24px; border-top: 2px solid #132a45; display: flex; align-items: center; gap: 12px;">
      <div class="btn" style="border-color: #b42318; color: #b42318;">キーワードを解除</div>
      <div style="flex-grow: 1;"></div>
      <div class="btn">キャンセル</div>
      <div class="btn-p">確定</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
