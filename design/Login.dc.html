<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', Meiryo, sans-serif; background: #f5f8fc; color: #132a45; }
    a { color: #14559c; } a:hover { color: #0d3d75; }
    .fld { border: 2px solid #132a45; border-radius: 4px; height: 46px; display: flex; align-items: center; padding: 0 12px; color: #566779; font-size: 15px; background: #fff; }
    .btn { border: 2px solid #132a45; border-radius: 4px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 16px; background: #132a45; color: #f5f8fc; }
    .lbl { font-size: 13px; color: #42566e; }
  </style>
</helmet>

<div style="width: 1180px; height: 800px; display: flex; flex-direction: column; background: #f5f8fc;">

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
    <div style="width: 420px; display: flex; flex-direction: column; gap: 24px; border: 2px solid #132a45; border-radius: 8px; padding: 40px 36px; background: #fff;">

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 26px;">穴埋め学習</div>
        <div class="lbl">ログインしてください</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div class="lbl">メールアドレス</div>
        <div class="fld">you@example.com</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div class="lbl">パスワード</div>
        <div class="fld">••••••••</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div class="btn">ログイン</div>
        <div style="font-size: 13px; color: #b42318; min-height: 18px;">メールアドレスまたはパスワードが違います</div>
      </div>

    </div>
  </div>

  <div style="display: flex; justify-content: center; padding-bottom: 40px;">
    <div style="font-size: 12px; color: #566779;">サインアップ導線なし / アカウントは Supabase 管理画面で作成</div>
  </div>

</div>
</x-dc>
</body>
</html>
