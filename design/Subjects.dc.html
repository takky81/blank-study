<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Zen Kurenaido', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif; background: #faf9f5; color: #26251f; }
    a { color: #8a6d1f; } a:hover { color: #5f4a12; }
    .hd { height: 56px; border-bottom: 2px solid #26251f; display: flex; align-items: center; padding: 0 24px; gap: 16px; background: #fff; }
    .btn { border: 2px solid #26251f; border-radius: 4px; height: 34px; display: flex; align-items: center; padding: 0 14px; font-size: 14px; background: #fff; }
    .btn-p { border: 2px solid #26251f; border-radius: 4px; height: 34px; display: flex; align-items: center; padding: 0 14px; font-size: 14px; background: #26251f; color: #faf9f5; }
    .btn-s { border: 1.5px solid #a8a69c; border-radius: 4px; height: 30px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #6b6a62; background: #fff; }
    .row { border: 2px solid #26251f; border-radius: 6px; background: #fff; display: flex; align-items: center; padding: 16px 20px; gap: 16px; }
    .muted { color: #8a887d; font-size: 13px; }
  </style>
</helmet>

<div style="width: 1180px; height: 800px; display: flex; flex-direction: column; background: #faf9f5;">

  <div class="hd">
    <div style="font-size: 17px;">穴埋め学習</div>
    <div style="flex-grow: 1;"></div>
    <div class="btn-s">学習履歴</div>
    <div class="btn-s">ダーク</div>
    <div class="btn-s">ログアウト</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 32px 40px;">

    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="font-size: 22px;">科目</div>
      <div style="flex-grow: 1;"></div>
      <div class="btn-p">＋ 科目を追加</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">

      <div class="row">
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
          <div style="font-size: 17px;">基本情報技術者</div>
          <div class="muted">教材 3 件 ・ キーワード 412 件</div>
        </div>
        <div class="btn-s">名前を変更</div>
        <div class="btn-s">削除</div>
      </div>

      <div class="row">
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
          <div style="font-size: 17px;">生物基礎</div>
          <div class="muted">教材 2 件 ・ キーワード 186 件</div>
        </div>
        <div class="btn-s">名前を変更</div>
        <div class="btn-s">削除</div>
      </div>

      <div class="row">
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
          <div style="font-size: 17px;">世界史</div>
          <div class="muted">教材 1 件 ・ キーワード 94 件</div>
        </div>
        <div class="btn-s">名前を変更</div>
        <div class="btn-s">削除</div>
      </div>

    </div>

    <div style="display: flex; align-items: center; justify-content: center; border: 2px dashed #c9c7bd; border-radius: 6px; height: 64px; color: #a8a69c; font-size: 13px;">
      行をドラッグして並べ替え
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
